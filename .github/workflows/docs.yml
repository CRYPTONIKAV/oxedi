name: Docs deploy

# Publishes the site to the gh-pages branch with mike: `dev` from every push to master, and
# `X.Y` plus the `latest` alias from every final v* tag (pre-releases and duckdb-v* tags do not
# publish). A manual run with a `version` (X.Y) publishes that version and moves `latest`, for a
# release made before this workflow existed. Pull requests only build the site, in the Documentation job of ci.yml.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Minor version to publish, as X.Y (also moves latest), e.g. 0.5"
        required: true
        type: string

# One deploy at a time: every run pushes to gh-pages.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy site
    # Never from a fork.
    if: github.repository == 'javillegasna/oxedi'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to gh-pages
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # mike needs the gh-pages history
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - name: Version to publish
        id: target
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "kind=release" >> "$GITHUB_OUTPUT"
              echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            else
              echo "version input must be X.Y, got $INPUT_VERSION"
              exit 1
            fi
          elif [ "$REF_TYPE" = "branch" ]; then
            echo "kind=dev" >> "$GITHUB_OUTPUT"
          elif [[ "$REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "kind=release" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            echo "kind=skip" >> "$GITHUB_OUTPUT"
            echo "Tag $REF_NAME is not a final release; nothing to publish."
          fi
      - name: Docs environment
        if: steps.target.outputs.kind != 'skip'
        run: make docs-dev
      - name: Git identity for mike
        if: steps.target.outputs.kind != 'skip'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Deploy dev
        if: steps.target.outputs.kind == 'dev'
        env:
          NO_MKDOCS_2_WARNING: "true"
        run: .venv-docs/bin/mike deploy --push --title "dev (unreleased)" dev
      - name: Deploy release and move latest
        if: steps.target.outputs.kind == 'release'
        env:
          NO_MKDOCS_2_WARNING: "true"
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          .venv-docs/bin/mike deploy --push --update-aliases "$VERSION" latest
          .venv-docs/bin/mike set-default --push latest
