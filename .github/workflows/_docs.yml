name: Docs

# The site in strict mode and every python and sql block of the docs and README (the SQL ones
# load the DuckDB extension built here), and the deploy script of docs.yml run without pushing on
# a local gh-pages branch. Called by ci.yml and nightly.yml; deploying is docs.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  docs:
    name: Site and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          cache-key: docs
          workspaces: |
            . -> target
            crates/oxedi_duckdb -> crates/oxedi_duckdb/target
      - uses: ./.github/actions/setup-uv
        with:
          cache-suffix: docs
      - name: Build the DuckDB extension
        run: |
          make configure_ci
          make release
      - uses: ./.github/actions/docs-venv
      - name: Site (strict)
        run: make docs
      - name: Examples
        run: make docs-test
      - name: Docs tools on PATH
        # mike runs mkdocs by name, so the venv's bin must be on PATH.
        run: echo "$PWD/.venv-docs/bin" >> "$GITHUB_PATH"
      # The deploy publishes the viewer next to the site, so the dry run builds its module.
      - name: wasm-bindgen CLI and wasm-opt
        uses: ./.github/actions/wasm-tools
      - name: Build the viewer's module
        run: make wasm
      # The deploy script of docs.yml with --no-push, three times on a local gh-pages branch that
      # starts from the fetched gh-pages when that exists (a shallow checkout may have no
      # origin/gh-pages ref, so the branch is taken from FETCH_HEAD): dev, a release above every
      # published version (999.0, which moves latest) and a lower one after it (998.0, which does
      # not). Each run ends with the script's own check of gh-pages; the assertions here pin which
      # aliases, viewers and llms.txt each run leaves. Nothing here pushes.
      - name: Deploy (dry run, no push)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin gh-pages; then git branch -f gh-pages FETCH_HEAD; fi
          log=$(mktemp)
          fail() { echo "deploy dry run: $*"; exit 1; }
          # The object id of a path on gh-pages, or "absent".
          blob() { git rev-parse -q --verify "gh-pages:$1" || echo absent; }
          # The files of the released viewer: viewer/ without viewer/dev/.
          released_viewer() { git ls-tree -r gh-pages -- viewer 2>/dev/null | grep -v $'\tviewer/dev/' || true; }
          expect_aliases() {
            local actual
            actual=$(git show gh-pages:versions.json | jq -c --arg v "$1" '[.[] | select(.version == $v) | .aliases[]]')
            [ "$actual" = "$2" ] || fail "after the $3 deploy, versions.json gives $1 the aliases $actual, expected $2"
          }

          # dev: its own version and viewer/dev/; viewer/ and llms.txt stay as they were.
          viewer=$(released_viewer); llms=$(blob llms.txt)
          .github/scripts/deploy-docs.sh --no-push dev
          expect_aliases dev '[]' dev
          git show gh-pages:viewer/dev/index.html | cmp -s - viewer/index.html || fail "after the dev deploy, gh-pages viewer/dev/index.html is not viewer/index.html"
          [ "$(released_viewer)" = "$viewer" ] || fail "the dev deploy changed viewer/ on gh-pages"
          [ "$(blob llms.txt)" = "$llms" ] || fail "the dev deploy changed llms.txt on gh-pages"

          # 999.0 moves latest: the alias, the default page, viewer/ and llms.txt follow it.
          .github/scripts/deploy-docs.sh --no-push release 999.0 | tee "$log"
          grep -qx "Version 999.0: latest moves = true" "$log" || fail "the 999.0 deploy did not decide to move latest"
          expect_aliases 999.0 '["latest"]' 999.0
          git show gh-pages:index.html | grep -q 'latest/' || fail "after the 999.0 deploy, gh-pages index.html does not redirect to latest/"
          git show gh-pages:viewer/index.html | cmp -s - viewer/index.html || fail "after the 999.0 deploy, gh-pages viewer/index.html is not viewer/index.html"
          git show gh-pages:llms.txt | cmp -s - docs/llms.txt || fail "after the 999.0 deploy, gh-pages llms.txt is not docs/llms.txt"

          # 998.0 keeps latest on 999.0 and leaves viewer/ and llms.txt alone. A marker line added
          # to docs/llms.txt reaches 998.0/llms.txt through mike and must not reach the root one.
          viewer=$(released_viewer); llms=$(blob llms.txt)
          echo "# deploy dry run marker" >> docs/llms.txt
          .github/scripts/deploy-docs.sh --no-push release 998.0 | tee "$log"
          git checkout -- docs/llms.txt
          grep -qx "Version 998.0: latest moves = false" "$log" || fail "the 998.0 deploy decided to move latest"
          expect_aliases 998.0 '[]' 998.0
          expect_aliases 999.0 '["latest"]' 998.0
          git show gh-pages:998.0/llms.txt | grep -qx "# deploy dry run marker" || fail "after the 998.0 deploy, gh-pages 998.0/llms.txt lacks the marker line"
          [ "$(released_viewer)" = "$viewer" ] || fail "the 998.0 deploy changed viewer/ on gh-pages"
          [ "$(blob llms.txt)" = "$llms" ] || fail "the 998.0 deploy changed llms.txt on gh-pages"
          echo "deploy dry run: dev, 999.0 (moves latest) and 998.0 (keeps it) left gh-pages as expected"
