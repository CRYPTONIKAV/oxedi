[workspace]
resolver = "3"
members = ["crates/oxedi_core", "crates/oxedi_py", "crates/oxedi_duckdb", "crates/oxedi_wasm"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
authors = ["javillegasna <javillegasna@gmail.com>"]
repository = "https://github.com/javillegasna/oxedi"
homepage = "https://javillegas.dev/oxedi/"
documentation = "https://javillegas.dev/oxedi/latest/"

[workspace.lints.clippy]
# Project-wide lint posture; CI enforces with -D warnings.
all = { level = "warn", priority = -1 }
self_named_module_files = "deny"
# Size and complexity ceilings; the thresholds are in clippy.toml.
cognitive_complexity = "warn"
excessive_nesting = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"
