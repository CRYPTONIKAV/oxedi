[package]
name = "oxedi_wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "WebAssembly binding of the oxedi core for the browser viewer"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
bench = false

[lints]
workspace = true

[dependencies]
oxedi_core = { path = "../oxedi_core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Exact pin: the wasm-bindgen CLI that generates the JS glue must be this same version.
wasm-bindgen = "=0.2.129"
